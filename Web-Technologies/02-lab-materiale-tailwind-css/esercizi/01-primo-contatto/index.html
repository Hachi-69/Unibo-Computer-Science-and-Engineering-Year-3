<!DOCTYPE html>
<!--
  Esercizio 01 · Primo contatto
  Livello 1 · Spartano · 7 minuti

  Obiettivo: collegare Tailwind dal CDN e usare le prime utility (colori, spaziature,
  tipografia).

  Consegna
  1. Aggiungi lo script del CDN nella <head>. Ricarica: titoli e link perdono lo stile del
     browser. È il Preflight, il reset di Tailwind.
  2. Applica a ogni elemento le sue classi:
     - pagina (body) → bg-stone-100 p-10
     - data → text-sm font-semibold uppercase tracking-widest text-teal-700
     - titolo → text-5xl font-bold text-stone-900
     - testo → mt-2 text-lg text-stone-600
     - link → inline-block mt-6 px-5 py-2 rounded-lg bg-teal-700 text-white font-semibold

  Il risultato atteso è nella slide dell'esercizio.
-->
