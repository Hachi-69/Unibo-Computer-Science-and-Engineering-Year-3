<!DOCTYPE html>
<!--
  Esercizio 10 · Bottoni: stati e varianti
  Livello 5 · Per i puristi · 10 minuti

  Obiettivo: creare un piccolo sistema di bottoni (base + varianti) con stati dentro @apply, e
  scoprire che le utility vincono sui componenti.

  Consegna
  1. Crea .btn: la forma comune a tutti i bottoni, con focus-visible: e disabled:
     → px-5 py-2.5 rounded-full font-semibold transition
  2. Crea .btn-primary (pieno) e .btn-outline (solo bordo), ognuno con il suo hover:.
  3. Nell'HTML combina le classi. Niente @apply btn: non funziona. → class="btn btn-primary"
  4. Prova ad aggiungere rounded-lg a un bottone: la utility vince sul componente.

  Il risultato atteso è nella slide dell'esercizio.
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW Day 2027 · 10 Bottoni: stati e varianti</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&family=Instrument+Serif&display=swap">
  <style type="text/tailwindcss">
    @theme {
      --color-brand-50:  #f0fdfa;
      --color-brand-100: #ccfbf1;
      --color-brand-500: #14b8a6;
      --color-brand-700: #0f766e;
      --color-brand-800: #115e59;

      --font-sans: "DM Sans", sans-serif;
      --font-display: "Instrument Serif", serif;
      --text-hero: 4.5rem;
      --radius-card: 1.25rem;
      --shadow-soft: 0 10px 30px rgb(0 0 0 / 0.12);
    }

    /* TODO 1 e 2: qui, dentro @layer components, .btn, .btn-primary e .btn-outline */
  </style>
</head>
<body class="bg-stone-100">
  <header class="sticky top-0 flex items-center justify-between bg-white border-b border-stone-200 px-4 md:px-8 py-4">
    <a href="#" class="font-display text-2xl text-brand-700">TW Day</a>
    <nav class="hidden md:flex gap-8 font-medium text-stone-600">
      <a href="#programma">Programma</a>
      <a href="#speaker">Speaker</a>
      <a href="#luogo">Luogo</a>
    </nav>
    <!-- TODO 3: bottone principale -->
    <a href="#iscrizione" class="inline-block px-5 py-2.5 rounded-full border-2 border-transparent bg-brand-700 text-white font-semibold transition hover:bg-brand-800 active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500">Iscriviti</a>
  </header>
  <main>
    <section class="max-w-5xl mx-auto px-4 md:px-8 py-20 text-center md:text-left">
      <p class="text-sm font-semibold uppercase tracking-widest text-brand-700">15 maggio 2027 · Aula Magna</p>
      <h1 class="mt-2 font-display text-4xl md:text-hero text-stone-900">TW Day 2027</h1>
      <p class="mt-2 text-lg text-stone-600">La giornata dei progetti di Tecnologie Web.</p>
      <div class="mt-6">
        <!-- TODO 3: bottone principale · TODO 4: poi prova ad aggiungere rounded-lg -->
        <a href="#iscrizione" class="inline-block px-5 py-2.5 rounded-full border-2 border-transparent bg-brand-700 text-white font-semibold transition hover:bg-brand-800 active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500">Iscriviti</a>
        <!-- TODO 3: bottone con solo il bordo (ml-2 è una utility di posizione: resta) -->
        <a href="#programma" class="inline-block px-5 py-2.5 rounded-full border-2 border-brand-700 text-brand-700 font-semibold transition hover:bg-brand-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500 ml-2">Vedi il programma</a>
      </div>
    </section>
    <section id="iscrizione" class="px-4 pb-16">
      <div class="max-w-xl mx-auto bg-white rounded-card shadow-soft p-8">
        <h2 class="font-display text-[28px] text-stone-900">Resta aggiornato</h2>
        <p class="mt-2 max-w-[45ch] text-stone-600">Ti scriviamo solo quando esce il programma completo.</p>
        <form action="#" class="mt-6 flex gap-3">
          <label for="email" class="sr-only">Email</label>
          <input id="email" type="email" placeholder="nome@esempio.it" class="flex-1 border border-stone-300 rounded-lg px-4 py-2 placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-brand-500">
          <!-- TODO 3: bottone principale -->
          <button type="submit" class="inline-block px-5 py-2.5 rounded-full border-2 border-transparent bg-brand-700 text-white font-semibold transition hover:bg-brand-800 active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500">Iscriviti</button>
        </form>
        <!-- TODO 3: bottone principale, disattivato (mt-4 è una utility di posizione: resta) -->
        <button type="button" disabled class="inline-block px-5 py-2.5 rounded-full border-2 border-transparent bg-brand-700 text-white font-semibold transition hover:bg-brand-800 active:scale-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500 disabled:opacity-50 disabled:cursor-not-allowed mt-4">Workshop al completo</button>
      </div>
    </section>
  </main>
</body>
</html>
