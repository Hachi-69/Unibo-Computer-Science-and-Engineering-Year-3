<!DOCTYPE html>
<!--
  Esercizio 11 · Il CSS in un file a parte
  Livello 5 · Per i puristi · 12 minuti

  Obiettivo: approccio purista estremo. L'HTML contiene solo nomi semantici e lo stile sta
  tutto in style.css, scritto in CSS classico. Tailwind, sempre dal CDN, dà solo il reset
  (Preflight) e i token del tema come variabili CSS.

  Consegna
  1. Collega style.css nella <head>, dopo lo script del CDN.
     → <link rel="stylesheet" href="style.css">
  2. Cambia @theme in @theme static: così Tailwind genera tutte le variabili del tema.
  3. Riscrivi ogni regola @apply in CSS classico, con le variabili del tema.
     → var(--color-brand-100) · var(--radius-card)
  4. Media query a mano, e nell'HTML nessuna utility: anche il body si stila in style.css.
     → @media (width >= 40rem) { … }

  Nel file esterno @apply e --spacing() non funzionano: è CSS normale.
  Il CSS esterno non sta in un layer: vince anche sulle utility.
  Usa var() solo per le variabili scritte in @theme static; gli altri valori li trovi nel
  promemoria in cima a style.css.

  Il risultato atteso è nella slide dell'esercizio.
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW Day 2027 · 11 Il CSS in un file a parte</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&family=Instrument+Serif&display=swap">
  <style type="text/tailwindcss">
    /* TODO 2: @theme diventa @theme static */
    @theme {
      --color-brand-50:  #f0fdfa;
      --color-brand-100: #ccfbf1;
      --color-brand-500: #14b8a6;
      --color-brand-700: #0f766e;
      --color-brand-800: #115e59;

      --font-sans: "DM Sans", sans-serif;
      --font-display: "Instrument Serif", serif;
      --text-hero: 4.5rem;
      --radius-card: 1.25rem;
      --shadow-soft: 0 10px 30px rgb(0 0 0 / 0.12);
    }

    /* TODO 3: riscrivi ogni regola in CSS classico, in style.css; alla fine qui resta solo il tema */
    @layer components {
      .program { @apply max-w-5xl mx-auto px-4 md:px-8 py-12; }
      .program-title { @apply font-display text-4xl text-stone-900 mb-8; }
      .talks { @apply grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6; }
      .talk { @apply relative bg-white rounded-card shadow-soft overflow-hidden; }
      .talk-cover { @apply h-32 flex items-center justify-center bg-brand-100 text-brand-800 text-2xl font-bold; }
      .talk-badge { @apply absolute top-3 right-3 bg-orange-700 text-white text-xs font-bold uppercase px-2 py-1 rounded-full; }
      .talk-body { @apply p-5; }
      .talk-title { @apply text-lg font-semibold text-stone-900; }
      .talk-text { @apply mt-1 text-stone-600; }
      .talk-meta { @apply mt-4 flex justify-between text-sm text-stone-500; }
    }
  </style>
  <!-- TODO 1: collega qui style.css -->
</head>
<body class="bg-stone-100">
  <!-- TODO 4: nell'HTML nessuna utility: togli la classe del body, lo sfondo va in style.css -->
  <section id="programma" class="program">
    <h2 class="program-title">Programma</h2>
    <div class="talks">
      <article class="talk">
        <div class="talk-cover">HTML</div>
        <span class="talk-badge">Nuovo</span>
        <div class="talk-body">
          <h3 class="talk-title">Pagine accessibili</h3>
          <p class="talk-text">Struttura semantica e attributi ARIA, con esempi pratici.</p>
          <div class="talk-meta">
            <span>10:00</span>
            <span>Aula 1</span>
          </div>
        </div>
      </article>
      <article class="talk">
        <div class="talk-cover">CSS</div>
        <div class="talk-body">
          <h3 class="talk-title">Layout con grid</h3>
          <p class="talk-text">Dalle colonne alle aree: impaginare senza fatica.</p>
          <div class="talk-meta">
            <span>11:30</span>
            <span>Aula 2</span>
          </div>
        </div>
      </article>
      <article class="talk">
        <div class="talk-cover">JS</div>
        <div class="talk-body">
          <h3 class="talk-title">Dati da un'API</h3>
          <p class="talk-text">Caricare dati da un server e mostrarli nella pagina.</p>
          <div class="talk-meta">
            <span>14:00</span>
            <span>Aula 1</span>
          </div>
        </div>
      </article>
    </div>
  </section>
</body>
</html>
