<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esercizio 1 - Vue e reattivita</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div id="app">
        <h1>Manipolazione del testo con Vue</h1>
        <p id="messaggio">{{ messaggio }}</p>
        <button type="button" @click="maiuscolo">Maiuscolo</button>
        <button type="button" @click="minuscolo">Minuscolo</button>
        <button type="button" @click="sposta">Sposta</button>
    </div>
</body>
</html>
